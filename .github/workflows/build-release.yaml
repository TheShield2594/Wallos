name: Build & Release
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main
  # Rebuild weekly so the image picks up Alpine security fixes even when
  # nothing in the repository changes.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  packages: write
env:
  # login to docker hub with provided secrets
  REGISTRY: docker.io
  REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
  # Docker Hub is optional: set the DOCKERHUB_TAG variable (and the
  # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets) to publish there as well.
  IMAGE_NAME: ${{ vars.DOCKERHUB_TAG }}
  GHCR_IMAGE: ghcr.io/theshield2594/tally

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_patterns: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - id: rp
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        # Versions, tags and the version.php bump are configured in
        # release-please-config.json and .release-please-manifest.json.
        uses: googleapis/release-please-action@v4
      - name: Prepare tags for Docker meta
        id: tags
        env:
          # When release please is skipped, these values will be empty
          is_release: ${{ steps.rp.outputs.release_created }}
          version: v${{ steps.rp.outputs.major }}.${{ steps.rp.outputs.minor }}.${{ steps.rp.outputs.patch }}
        run: |
          tags=""
          if [[ "$is_release" = 'true' ]]; then
            tags="type=semver,pattern={{version}},value=$version
            type=ref,event=branch,value=main"
          else
            tags="type=ref,event=branch
            type=ref,event=pr"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Same PHP version and extensions as the Docker image.
          php-version: "8.3"
          extensions: sqlite3, pdo_sqlite, curl, gd, intl, mbstring, openssl, calendar, zip
          coverage: none
      - name: Run tests
        # tests/run.php exits non-zero when any case fails.
        run: php tests/run.php

  build:
    runs-on: ubuntu-latest
    # No image is built, or pushed, from code whose tests fail.
    needs: [release, tests]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request' && env.IMAGE_NAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: images
        run: |
          images="$GHCR_IMAGE"
          if [ -n "$IMAGE_NAME" ]; then
            images="$REGISTRY/$IMAGE_NAME"$'\n'"$images"
          fi
          {
            echo 'list<<EOF'
            echo "$images"
            echo EOF
            echo "csv=$(echo "$images" | paste -sd, -)"
          } >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: ${{ needs.release.outputs.tag_patterns }}
      # necessary for multi-platform images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # necessary for multi-platform images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Always re-pull the base image and rerun the final apk upgrade layer.
          pull: true
          build-args: |
            APK_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=image,"name=${{ steps.images.outputs.csv }}",push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Scope cache per platform to prevent architecture-mismatched layers
          cache-from: type=gha,scope=${{ github.workflow }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-${{ matrix.platform }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || matrix.platform == 'linux/arm64' && 'arm64' || 'armv7' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    env:
      # Read here so the Discord step can be skipped when it isn't set.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    needs: [release, build]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Log into registry ${{ env.REGISTRY }}
        if: env.IMAGE_NAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Image names
        id: images
        run: |
          images="$GHCR_IMAGE"
          if [ -n "$IMAGE_NAME" ]; then
            images="$REGISTRY/$IMAGE_NAME"$'\n'"$images"
          fi
          {
            echo 'list<<EOF'
            echo "$images"
            echo EOF
            echo "csv=$(echo "$images" | paste -sd, -)"
          } >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: ${{ needs.release.outputs.tag_patterns }}
      - name: Create manifest list and push to Docker Hub
        if: env.IMAGE_NAME != ''
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("${{ env.REGISTRY }}")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Create manifest list and push to GHCR
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io")) | "-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)
      - name: Send notification to Discord
        if: needs.release.outputs.release_created == 'true' && env.DISCORD_WEBHOOK != ''
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # v0.4.0 (pin @master to a full commit SHA)
        with:
          args: "A new release has been created: ${{ steps.meta.outputs.version }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
