name: Tests
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Same PHP version and extensions as the Docker image.
          php-version: "8.3"
          extensions: sqlite3, pdo_sqlite, curl, gd, intl, mbstring, openssl, calendar, zip
          coverage: none
      - name: Run tests
        # tests/run.php exits non-zero when any case fails.
        run: php tests/run.php
